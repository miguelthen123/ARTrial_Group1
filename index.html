<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR_TrialGroup1</title>
    
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      .a-canvas {
        pointer-events: auto !important;
      }
    </style>

    <script>
      // Component to handle opening external websites on tap
      AFRAME.registerComponent('url-link', {
        schema: { href: { type: 'string' } },
        init: function () {
          this.el.addEventListener('click', (evt) => {
            evt.stopPropagation(); // Prevent triggering sphere toggle underneath
            if (this.data.href) {
              window.open(this.data.href, '_blank');
            }
          });
        }
      });

      // Component to toggle content and automatically project a line to the next spot
      AFRAME.registerComponent('spot-toggle', {
        schema: { 
          model: { type: 'selector' },
          button: { type: 'selector' },
          nextSpot: { type: 'selector' } // Target spot to auto-connect to
        },
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material').color;
          let activeLine = null;

          el.addEventListener('click', () => {
            const model = this.data.model;
            const button = this.data.button;
            const nextSpot = this.data.nextSpot;
            const container = document.querySelector('#lines-container');

            const isActive = el.getAttribute('data-active') === 'true';

            if (isActive) {
              // Deactivate current spot
              el.setAttribute('data-active', 'false');
              if (model) model.setAttribute('visible', false);
              if (button) button.setAttribute('visible', false);
              el.setAttribute('material', 'color', originalColor);

              // Remove direction line
              if (activeLine && activeLine.parentNode) {
                activeLine.parentNode.removeChild(activeLine);
                activeLine = null;
              }
            } else {
              // Activate current spot
              el.setAttribute('data-active', 'true');
              if (model) model.setAttribute('visible', true);
              if (button) button.setAttribute('visible', true);
              el.setAttribute('material', 'color', '#FFFF00');

              // Automatically generate line pointing to the next target spot
              if (nextSpot && container) {
                if (activeLine && activeLine.parentNode) {
                  activeLine.parentNode.removeChild(activeLine);
                }

                const startPos = el.getAttribute('position');
                const endPos = nextSpot.getAttribute('position');

                activeLine = document.createElement('a-entity');
                activeLine.setAttribute('line', {
                  start: `${startPos.x} ${startPos.y} ${startPos.z}`,
                  end: `${endPos.x} ${endPos.y} ${endPos.z}`,
                  color: '#FFFF00',
                  opacity: 0.95
                });

                container.appendChild(activeLine);
              }
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="glb1" src="./models/model1.glb"></a-asset-item>
        <a-asset-item id="glb2" src="./models/model2.glb"></a-asset-item>
        <a-asset-item id="glb3" src="./models/model3.glb"></a-asset-item>
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false" 
        raycaster="objects: .clickable; far: 10000; interval: 100" 
        cursor="fuse: false; rayOrigin: mouse">
      </a-camera>

      <!-- Tracked Target Container -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Dynamic Lines Container -->
        <a-entity id="lines-container"></a-entity>

        <!-- SPOT 1: Church / Clocktower (Points to Spot 2) -->
        <a-sphere 
          id="spot1"
          class="clickable" 
          spot-toggle="model: #model1; button: #btn1; nextSpot: #spot2" 
          position="0.2 0.35 0.05" 
          radius="0.06" 
          material="color: #FF4136; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model1" 
          src="#glb1" 
          position="0.2 0.35 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>
        <a-plane 
          id="btn1" 
          class="clickable" 
          url-link="href: https://akaswap.com/akaobj/27627" 
          position="0.2 0.23 0.05" 
          width="0.28" 
          height="0.08" 
          material="color: #111111; opacity: 0.9" 
          text="value: Visit Site; align: center; color: #FFFFFF; width: 1.2" 
          visible="false">
        </a-plane>


        <!-- SPOT 2: Lady with Umbrella (Points to Spot 3) -->
        <a-sphere 
          id="spot2"
          class="clickable" 
          spot-toggle="model: #model2; button: #btn2; nextSpot: #spot3" 
          position="-0.3 0.0 0.05" 
          radius="0.06" 
          material="color: #2ECC40; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model2" 
          src="#glb2" 
          position="-0.3 0.0 0.1" 
          scale="0.8 0.8 0.8" 
          visible="false">
        </a-gltf-model>
        <a-plane 
          id="btn2" 
          class="clickable" 
          url-link="href: https://akaswap.com/akaobj/27626" 
          position="-0.3 -0.12 0.05" 
          width="0.28" 
          height="0.08" 
          material="color: #111111; opacity: 0.9" 
          text="value: Explore More; align: center; color: #FFFFFF; width: 1.2" 
          visible="false">
        </a-plane>


        <!-- SPOT 3: Archway (Points to Spot 1) -->
        <a-sphere 
          id="spot3"
          class="clickable" 
          spot-toggle="model: #model3; button: #btn3; nextSpot: #spot1" 
          position="0.2 -0.4 0.05" 
          radius="0.06" 
          material="color: #0074D9; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model3" 
          src="#glb3" 
          position="0.2 -0.4 0.1" 
          scale="0.5 0.5 0.5" 
          visible="false">
        </a-gltf-model>
        <a-plane 
          id="btn3" 
          class="clickable" 
          url-link="href: https://akaswap.com/akaobj/27628" 
          position="0.2 -0.52 0.05" 
          width="0.28" 
          height="0.08" 
          material="color: #111111; opacity: 0.9" 
          text="value: View Details; align: center; color: #FFFFFF; width: 1.2" 
          visible="false">
        </a-plane>

      </a-entity>
    </a-scene>
  </body>
</html>
