<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindAR Interactive Map with Directions</title>
    
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      .a-canvas {
        pointer-events: auto !important;
      }
    </style>

    <script>
      AFRAME.registerComponent('spot-toggle', {
        schema: { 
          model: { type: 'selector' },
          nextPath: { type: 'selector' } // Connected directional line entity
        },
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material').color;

          el.addEventListener('click', () => {
            const model = this.data.model;
            const path = this.data.nextPath;

            if (model) {
              const isVisible = model.getAttribute('visible');
              const nextState = !isVisible;
              
              // 1. Toggle 3D model visibility
              model.setAttribute('visible', nextState);
              
              // 2. Change sphere highlight color
              el.setAttribute('material', 'color', nextState ? '#FFFF00' : originalColor);

              // 3. Reveal/hide directional line to the next landmark
              if (path) {
                path.setAttribute('visible', nextState);
              }
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="glb1" src="./models/model1.glb"></a-asset-item>
        <a-asset-item id="glb2" src="./models/model2.glb"></a-asset-item>
        <a-asset-item id="glb3" src="./models/model3.glb"></a-asset-item>
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false" 
        raycaster="objects: .clickable; far: 10000; interval: 100" 
        cursor="fuse: false; rayOrigin: mouse">
      </a-camera>

      <!-- Tracked Target Container -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- DIRECTIONAL PATH 1: Links Spot 1 -> Spot 2 -->
        <a-entity 
          id="path12" 
          line="start: 0.2 0.35 0.05; end: -0.3 0.0 0.05; color: #FFFF00" 
          visible="false">
        </a-entity>

        <!-- DIRECTIONAL PATH 2: Links Spot 2 -> Spot 3 -->
        <a-entity 
          id="path23" 
          line="start: -0.3 0.0 0.05; end: 0.2 -0.4 0.05; color: #FFFF00" 
          visible="false">
        </a-entity>


        <!-- Spot 1: Church (Reveals Model 1 + Path to Spot 2) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model1; nextPath: #path12" 
          position="0.2 0.35 0.05" 
          radius="0.06" 
          material="color: #FF4136; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model1" 
          src="#glb1" 
          position="0.2 0.35 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 2: Lady with Umbrella (Reveals Model 2 + Path to Spot 3) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model2; nextPath: #path23" 
          position="-0.3 0.0 0.05" 
          radius="0.06" 
          material="color: #2ECC40; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model2" 
          src="#glb2" 
          position="-0.3 0.0 0.1" 
          scale="0.5 0.5 0.5" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 3: Archway (Final Target) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model3" 
          position="0.2 -0.4 0.05" 
          radius="0.06" 
          material="color: #0074D9; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model3" 
          src="#glb3" 
          position="0.2 -0.4 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
