<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR_Trial Group 1</title>
    
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      .a-canvas {
        pointer-events: auto !important;
      }
    </style>

    <script>
      // Sequence array to track clicked spheres in order
      let activeSequence = [];

      // Function to re-render connection lines based on current active order
      function updateDynamicPaths() {
        const container = document.querySelector('#lines-container');
        
        // Clear all existing line entities
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        // Draw lines sequentially between clicked spots
        for (let i = 0; i < activeSequence.length - 1; i++) {
          const startPos = activeSequence[i].getAttribute('position');
          const endPos = activeSequence[i + 1].getAttribute('position');

          const lineEntity = document.createElement('a-entity');
          lineEntity.setAttribute('line', {
            start: `${startPos.x} ${startPos.y} ${startPos.z}`,
            end: `${endPos.x} ${endPos.y} ${endPos.z}`,
            color: '#FFFF00',
            opacity: 0.95
          });

          container.appendChild(lineEntity);
        }
      }

      // Interaction Component
      AFRAME.registerComponent('spot-toggle', {
        schema: { 
          model: { type: 'selector' }
        },
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material').color;

          el.addEventListener('click', () => {
            const model = this.data.model;
            const index = activeSequence.indexOf(el);

            if (index > -1) {
              // Deactivate if tapped again: remove from sequence
              activeSequence.splice(index, 1);
              if (model) model.setAttribute('visible', false);
              el.setAttribute('material', 'color', originalColor);
            } else {
              // Activate: add to sequence
              activeSequence.push(el);
              if (model) model.setAttribute('visible', true);
              el.setAttribute('material', 'color', '#FFFF00');
            }

            // Re-draw lines dynamically
            updateDynamicPaths();
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="glb1" src="./models/model1.glb"></a-asset-item>
        <a-asset-item id="glb2" src="./models/model2.glb"></a-asset-item>
        <a-asset-item id="glb3" src="./models/model3.glb"></a-asset-item>
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false" 
        raycaster="objects: .clickable; far: 10000; interval: 100" 
        cursor="fuse: false; rayOrigin: mouse">
      </a-camera>

      <!-- Tracked Target Container -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Dynamic Lines Container -->
        <a-entity id="lines-container"></a-entity>

        <!-- Spot 1: Church / Clocktower -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model1" 
          position="0.2 0.35 0.05" 
          radius="0.06" 
          material="color: #FF4136; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model1" 
          src="#glb1" 
          position="0.2 0.35 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 2: Lady with Umbrella -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model2" 
          position="-0.3 0.0 0.05" 
          radius="0.06" 
          material="color: #2ECC40; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model2" 
          src="#glb2" 
          position="-0.3 0.0 0.1" 
          scale="0.8 0.8 0.8" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 3: Archway -->
        <a-sphere 
          class="clickable" 
          spot-toggle="model: #model3" 
          position="0.2 -0.4 0.05" 
          radius="0.06" 
          material="color: #0074D9; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model3" 
          src="#glb3" 
          position="0.2 -0.4 0.1" 
          scale="0.5 0.5 0.5" 
          visible="false">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
