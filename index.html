<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindAR Interactive Map</title>
    
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* Fix mobile pointer pass-through */
      .a-canvas {
        pointer-events: auto !important;
      }
    </style>

    <script>
      // Component to handle tap interaction, visual feedback, and model toggling
      AFRAME.registerComponent('spot-toggle', {
        schema: { target: { type: 'selector' } },
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material').color;

          el.addEventListener('click', () => {
            const model = this.data.target;
            if (!model) {
              console.error('Target model not found');
              return;
            }

            const isVisible = model.getAttribute('visible');
            const nextState = !isVisible;
            
            // 1. Toggle visibility of the 3D model
            model.setAttribute('visible', nextState);
            
            // 2. Visual feedback: turn sphere yellow when active, reset when off
            el.setAttribute('material', 'color', nextState ? '#FFFF00' : originalColor);
            
            console.log(`Toggled ${model.id} visibility to: ${nextState}`);
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- NOTE: Ensure folder names and file extensions match EXACTLY (case-sensitive) -->
        <a-asset-item id="glb1" src="./models/model1.glb"></a-asset-item>
        <a-asset-item id="glb2" src="./models/model2.glb"></a-asset-item>
        <a-asset-item id="glb3" src="./models/model3.glb"></a-asset-item>
      </a-assets>

      <!-- Raycasting Camera Setup for Mobile Touch -->
      <a-camera 
        position="0 0 0" 
        look-controls="enabled: false" 
        raycaster="objects: .clickable; far: 10000; interval: 100" 
        cursor="fuse: false; rayOrigin: mouse">
      </a-camera>

      <!-- Tracked Target Container -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Spot 1: Church / Clocktower (Top Right) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="target: #model1" 
          position="0.2 0.35 0.05" 
          radius="0.06" 
          material="color: #FF4136; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model1" 
          src="#glb1" 
          position="0.2 0.35 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 2: Lady with Umbrella (Center Left) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="target: #model2" 
          position="-0.3 0.0 0.05" 
          radius="0.06" 
          material="color: #2ECC40; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model2" 
          src="#glb2" 
          position="-0.3 0.0 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

        <!-- Spot 3: Bottom Archway (Bottom Right) -->
        <a-sphere 
          class="clickable" 
          spot-toggle="target: #model3" 
          position="0.2 -0.4 0.05" 
          radius="0.06" 
          material="color: #0074D9; opacity: 0.8">
        </a-sphere>
        <a-gltf-model 
          id="model3" 
          src="#glb3" 
          position="0.2 -0.4 0.1" 
          scale="0.2 0.2 0.2" 
          visible="false">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
